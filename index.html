<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dana Debates Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d0d0d;
            color: #f5f0e8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f5f0e8;
        }

        .card-count {
            background: #2a2a2a;
            color: #888;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            align-items: flex-start;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #444;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox:hover {
            border-color: #c9432a;
        }

        .checkbox.done {
            background: #c9432a;
            border-color: #c9432a;
        }

        .checkbox.done::after {
            content: '✓';
            color: white;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-item.done .task-title {
            text-decoration: line-through;
            color: #666;
        }

        .task-meta {
            font-size: 0.85rem;
            color: #888;
        }

        .task-meta a {
            color: #c9432a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .task-meta a:hover {
            color: #e05a3a;
            text-decoration: underline;
        }

        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status.ready {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status.draft {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .status.pending {
            background: rgba(201, 67, 42, 0.2);
            color: #c9432a;
        }

        .empty-state {
            color: #555;
            font-style: italic;
            padding: 20px 0;
            text-align: center;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dana Debates Dashboard</h1>
            <p class="subtitle">Last updated: February 20, 2026</p>
        </header>

        <div class="grid">
            <!-- Authenticity Edge Funnel -->
            <div class="card">
                <div class="card-header">
                    <h2>📄 Authenticity Edge Funnel</h2>
                    <span class="card-count">0 tasks</span>
                </div>
                <ul class="task-list">
                    <li class="empty-state">No tasks yet</li>
                </ul>
            </div>

            <!-- Email Sequences -->
            <div class="card">
                <div class="card-header">
                    <h2>📧 Email Sequences</h2>
                    <span class="card-count">0 tasks</span>
                </div>
                <ul class="task-list">
                    <li class="empty-state">No tasks yet</li>
                </ul>
            </div>

            <!-- YouTube Episodes -->
            <div class="card">
                <div class="card-header">
                    <h2>🎬 YouTube Episodes</h2>
                    <span class="card-count">0 tasks</span>
                </div>
                <ul class="task-list">
                    <li class="empty-state">No tasks yet</li>
                </ul>
            </div>

            <!-- Graphics & Assets -->
            <div class="card">
                <div class="card-header">
                    <h2>🎨 Graphics & Assets</h2>
                    <span class="card-count">0 tasks</span>
                </div>
                <ul class="task-list">
                    <li class="empty-state">No tasks yet</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Toggle checkbox state
        document.querySelectorAll('.checkbox').forEach(box => {
            box.addEventListener('click', () => {
                box.classList.toggle('done');
                box.closest('.task-item')?.classList.toggle('done');
            });
        });
    </script>
</body>
</html>
